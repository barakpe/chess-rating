# Chess Rating Estimation — single source of truth for every knob.
# Every script reads this file (via src/config.py). No magic numbers in code.

# --- Data selection ---
month: "2025-05"                 # a COMPLETE month; must exist on https://database.lichess.org/
time_control: "blitz"            # human label; the real filter is blitz_estimate_seconds below
blitz_estimate_seconds: [180, 479]   # keep if (base + 40*inc) is in this inclusive range
                                     # (scalachess Speed ranges: Blitz = 180..479s)
use_stored_evals: true           # only keep games that already carry stored [%eval] annotations
                                  # (games analysed with Stockfish on Lichess) rather than computing
                                  # our own evals from scratch

# --- Sampling ---
sample_size: 300000              # reservoir-sample size (games)
max_games_scanned: 15000000      # scan budget: stop after the FIRST 15M games of the dump. The dump
                                 # is chronological, so for 2025-05 this covers May 1-5 (UTC); the
                                 # exact window is written to reports/data_funnel.json. null = whole file.
random_seed: 42                  # fix everywhere for reproducibility
player_cohort:                   # ALSO keep every in-window game of a hash-sampled player subset, so
  enabled: true                  # the modelling data contains players with many games. src.clean
  hash_rate: 0.005               # unions it with the reservoir sample (dedup on game_id).
  max_games: 100000              # safety cap on cohort rows held in memory

# --- Cleaning / filtering ---
min_plies: 10                    # drop aborted / ultra-short games
exclude_bots: true               # drop games with WhiteTitle/BlackTitle == "BOT"
keep_terminations: ["Normal", "Time forfeit"]
                                 # allowlist of Lichess Termination header values. Everything else
                                 # ("Abandoned", "Rules infraction", "Unterminated") is dropped.

# --- Labels / evaluation buckets ---
rating_bands: [0, 1200, 1400, 1600, 1800, 2000, 3000]   # band edges; the last band is open-ended
                                                         # (ratings >= 2000, incl. the few >= 3000)

# --- Eval handling (Win% / centipawn math) ---
eval:
  cp_clamp: 1000                 # clamp centipawns (and fold forced mates) to +/- this, as Lichess does
  start_cp: 15                   # assumed eval of the start position (the first move's "before")

# --- Game-phase boundaries (pragmatic) ---
phases:
  opening_max_ply: 30            # plies 1-30 (~15 full moves) count as the opening
  endgame_nonpawn_pieces: 6      # middlegame -> endgame when non-pawn, non-king pieces (both sides) <= this

# --- Cleaning (Stage 2) ---
clean:
  min_rating: 400                # drop implausible/corrupt rating labels below this
  max_rating: 4000               # ...or above this (Lichess blitz tops out ~3100)

# --- Feature engineering (Stage 4) ---
features:
  fast_move_seconds: 1.0         # a move played faster than this counts as "very fast"
  time_trouble_seconds: 15       # remaining clock below this counts as time trouble
  scramble_seconds: 30           # remaining clock (before the move) below this = clock scramble;
                                 # scramble_* features measure quality/tempo under this pressure
  winning_winpct: 80             # Win% at/above which a position is "winning" (conversion feature)

# --- Modeling (Stages 5-6) ---
model:
  test_size: 0.2                 # grouped hold-out fraction (split by username, never by game)
  val_size: 0.2                  # grouped validation fraction (carved from train) for early stopping
  calib_size: 0.15               # grouped calibration fraction (carved from train after val); used only
                                 # by post-hoc steps (conformal correction, aggregate recalibration)
  ridge_alpha: 10.0
  early_stopping_rounds: 50
  quantiles: [0.05, 0.5, 0.95]   # lower / median / upper -> a 90% prediction interval
  cqr_two_sided: false           # CQR: one symmetric correction (false) or per-side alpha/2 (true)
  mondrian_cqr: true             # headline interval = band-conditional (Mondrian) CQR by PREDICTED-median
                                 # band; plain CQR is always computed alongside for comparison
  mondrian_min_calib: 200        # predicted bands with fewer calib scores fall back to the global correction
  balance_strength: 0.5          # tail-study reweighting exponent (0=uniform, 1=full inverse-frequency)
  reweight_bin_width: 100        # tail-study reweighting uses rating-frequency in bins of this width
                                 # (Elo). Not the 6 confusion bands: the two outer bands are the
                                 # LARGEST, so weighting by band frequency would down-weight the tails.
  lgbm:
    n_estimators: 3000           # upper bound; early stopping picks the real count
    learning_rate: 0.03
    num_leaves: 63
  tune:                          # Optuna search, opt-in via `python -m src.evaluate --tune`
    n_trials: 25
    cv_folds: 3                  # GroupKFold folds inside the Optuna objective

# --- Evaluation & error analysis (Stages 7-8) ---
evaluate:
  aggregation_k: [1, 2, 3, 5, 10, 20]      # games-per-player for the (shifting-cohort) aggregation curve
  aggregation_min_players: 30    # only report a K if >= this many players have >= K test games
  matched_k: [1, 2, 3, 5, 10]    # matched curve: the SAME players (>= max K games) at every K
  matched_draws: 40              # random K-subsets averaged per player in the matched curve
  bootstrap_reps: 1000           # player-clustered bootstrap replicates for confidence intervals
  calibration_bins: 10
  error_analysis_top_n: 20       # largest-residual games to inspect
  shap_max_display: 15           # features shown in the SHAP summary

# --- Paths ---
paths:
  raw: data/raw
  processed: data/processed
  figures: reports/figures

outputs:
  blitz_sample: data/processed/blitz_sample.parquet   # Stage 1 (ingest, reservoir sample)
  player_cohort: data/processed/player_cohort.parquet # Stage 1 (ingest, player-cohort sample)
  games_clean: data/processed/games_clean.parquet     # Stage 2 (sample + cohort, deduped + cleaned)
  instances: data/processed/instances.parquet         # Stage 3 (2 rows/game, per-player labels)
  features: data/processed/features.parquet           # Stage 4 (per-player feature vectors)
  data_funnel: reports/data_funnel.json               # Stages 1-3 funnel counts + scan window
  results_log: reports/results.md                     # append-only experiment log
  eval_artifacts: reports/eval_artifacts.json         # Stage 7-8 structured results (read by notebooks)
  largest_residuals: reports/largest_residuals.csv    # Stage 8 worst single-game misses
